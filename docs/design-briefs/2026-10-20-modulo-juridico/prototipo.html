/* ---- Protótipo: o que o Tailwind não cobre ---- */
.gutter { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.barra-lateral { box-sizing: content-box; padding-left: env(safe-area-inset-left, 0px); }
.menu-movel { top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 768px) {
  .conteudo { padding-left: calc(76px + env(safe-area-inset-left, 0px)); }
  .gutter { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}
.barra-proto { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.toasts { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
.cabeca-gaveta { padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.rodape-gaveta { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.modal-seguro { padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }

@keyframes p-fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes p-gaveta { from { transform: translateX(28px); opacity: .5 } to { transform: none; opacity: 1 } }
@keyframes p-sobe { from { transform: translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes p-destaque { 0%, 100% { background-color: #fff4d6 } 50% { background-color: #ffe39a } }
.anim-fade { animation: p-fade .18s ease-out }
.anim-gaveta { animation: p-gaveta .26s cubic-bezier(.2,.8,.2,1) }
.anim-sobe { animation: p-sobe .18s ease-out }
.barra-proto.anim-sobe { animation: none }
.linha-destaque td { background-color: #fff4d6 !important; animation: p-destaque 1.4s ease-in-out 3; }
.linha-destaque td:first-child { box-shadow: inset 3px 0 0 #E74B56; font-weight: 600; }

/* Prazo (versão B): a faixa à esquerda diz a urgência antes do texto. */
.faixa-alta { box-shadow: inset 3px 0 0 #E74B56; }
.faixa-media { box-shadow: inset 3px 0 0 #f59e0b; }

/* Colunas novas nas telas do job. */
th.destaque-coluna { color: #b3323c; }
td.destaque-coluna { background-color: #fffbfb; }

/* ---- O papel do contrato ---- */
.papel { max-width: 720px; margin: 0 auto; background: #ffffff; color: #1f1f1f; font-family: var(--font-doc); font-size: 14.5px; line-height: 1.72; padding: 56px 64px 64px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 14px 34px -14px rgba(0,0,0,.22); }
.papel-titulo { text-align: center; font-weight: 700; font-size: 15.5px; letter-spacing: .05em; margin: 0 0 24px; }
.papel-clausula { font-weight: 700; font-size: 12.5px; letter-spacing: .05em; margin: 20px 0 6px; }
.papel-par { text-align: justify; hyphens: auto; margin: 0 0 10px; }
.papel-opcional { border-left: 2px solid #f6b3b9; padding-left: 10px; margin-left: -12px; }
.papel-tag { font-family: var(--font-sans); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #b3323c; background: #fef0f1; border-radius: 4px; padding: 1px 5px; margin-left: 8px; vertical-align: 2px; }
.papel-assinaturas { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 56px; font-family: var(--font-sans); font-size: 11.5px; text-align: center; color: #3a3a3a; }
.papel-assinaturas span { display: block; border-top: 1px solid #282828; margin-bottom: 6px; }
.ph { border-radius: 3px; padding: 0 2px; }
.ph-sys { background: #eef4fd; box-shadow: inset 0 -1px 0 #9dbbe9; color: #173f86; }
.ph-ok { background: #e8f8f0; box-shadow: inset 0 -1px 0 #86d4ae; color: #065f46; }
.ph-vazia { display: inline; background: #fdecee; color: #b3323c; font-family: var(--font-sans); font-size: .8em; font-weight: 600; line-height: 1.4; padding: 1px 6px; border: 1px dashed #f3a3aa; cursor: pointer; }
.ph-vazia:hover { background: #fbdde0; }
.ph-erro { background: #b42318; color: #fff; font-family: ui-monospace, monospace; font-size: .8em; }
@media (max-width: 640px) {
  .papel { padding: 28px 22px 36px; font-size: 13.5px; }
  .papel-assinaturas { grid-template-columns: 1fr; gap: 28px; }
}
:focus-visible { outline-color: #E74B56; }
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---- Janela grande centralizada (antes, gaveta lateral) ---- */
@keyframes p-janela { from { transform: translateY(10px) scale(.985); opacity: 0 } to { transform: none; opacity: 1 } }
.anim-janela { animation: p-janela .22s cubic-bezier(.2,.8,.2,1) }
@media (min-width: 640px) {
  .janela-grande { padding-top: max(24px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
  .janela-grande .cabeca-gaveta { padding-top: 20px; }
  .janela-grande .rodape-gaveta { padding-bottom: 12px; }
}

/* ---- Documento editável (como no Docs/Word) ---- */
.doc-livre { counter-reset: clausula; }
.doc-livre h3 { text-align: center; font-weight: 700; font-size: 15.5px; letter-spacing: .05em; margin: 0 0 24px; }
.doc-livre h4 { counter-increment: clausula; font-weight: 700; font-size: 12.5px; letter-spacing: .05em; margin: 20px 0 6px; }
.doc-livre h4::before { content: "CLÁUSULA " counter(clausula) "ª — "; }
.doc-livre p { text-align: justify; hyphens: auto; margin: 0 0 10px; }
.doc-editando { outline: none; cursor: text; caret-color: #E74B56; }
.doc-editando:focus { box-shadow: 0 0 0 2px rgba(231,75,86,.28), 0 14px 34px -14px rgba(0,0,0,.22); }
.doc-editando h4::before { color: #a3a3a3; }
.doc-final .ph-sys { background: none; box-shadow: none; color: inherit; padding: 0; }
.chip { display: inline; border-radius: 4px; padding: 1px 6px; font-family: var(--font-sans); font-size: .76em; font-weight: 600; line-height: 1.5; white-space: nowrap; cursor: default; user-select: all; }
.chip-sys { background: #eef4fd; color: #173f86; border: 1px solid #c9dbf5; }

/* ---------- Formatação ---------- */

const MOEDA = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const moeda = (v) => MOEDA.format(v || 0);

function dataBr(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.slice(0, 10).split("-");
  return `${d}/${m}/${y}`;
}
function dataCurta(iso) {
  if (!iso) return "—";
  const [, m, d] = iso.slice(0, 10).split("-");
  return `${d}/${m}`;
}
function dataHoraBr(iso) {
  if (!iso) return "—";
  return iso.length > 10 ? `${dataBr(iso)} ${iso.slice(11, 16)}` : dataBr(iso);
}
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
function dataExtenso(iso) {
  const [y, m, d] = iso.slice(0, 10).split("-");
  return `${Number(d)} de ${MESES[Number(m) - 1]} de ${y}`;
}
function dias(de, ate) {
  return Math.round((Date.parse(ate.slice(0, 10) + "T12:00:00") - Date.parse(de.slice(0, 10) + "T12:00:00")) / 86400000);
}
function relativo(iso) {
  const d = dias(iso, HOJE);
  if (d <= 0) return "hoje";
  if (d === 1) return "ontem";
  return `há ${d} dias`;
}
function agoraIso() {
  const t = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${HOJE}T${p(t.getHours())}:${p(t.getMinutes())}`;
}
function iniciais(nome) {
  return nome.split(" ").filter(Boolean).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
}
function slug(txt) {
  return txt.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 32) || "lacuna";
}

/* ---------- Valor por extenso (cláusula de preço) ---------- */

const UNID = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove"];
const DEZ_A_DEZENOVE = ["dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
const DEZENAS = ["", "", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
const CENTENAS = ["", "cento", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos", "oitocentos", "novecentos"];

function ate999(n) {
  if (n === 100) return "cem";
  const c = Math.floor(n / 100), r = n % 100, partes = [];
  if (c) partes.push(CENTENAS[c]);
  if (r) {
    if (r < 10) partes.push(UNID[r]);
    else if (r < 20) partes.push(DEZ_A_DEZENOVE[r - 10]);
    else partes.push(DEZENAS[Math.floor(r / 10)] + (r % 10 ? " e " + UNID[r % 10] : ""));
  }
  return partes.join(" e ");
}

function inteiroPorExtenso(n) {
  if (n === 0) return "zero";
  const mi = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1000), un = n % 1000;
  const grupos = [];
  if (mi) grupos.push({ v: mi, t: mi === 1 ? "um milhão" : ate999(mi) + " milhões" });
  if (mil) grupos.push({ v: mil, t: mil === 1 ? "mil" : ate999(mil) + " mil" });
  if (un) grupos.push({ v: un, t: ate999(un) });
  return grupos.reduce((acc, g, i) => {
    if (i === 0) return g.t;
    const ultimo = i === grupos.length - 1;
    // "mil e quinhentos", "mil e vinte" — mas "mil duzentos e trinta".
    const comE = ultimo && (g.v < 100 || g.v % 100 === 0);
    return acc + (comE ? " e " : ultimo ? " " : ", ") + g.t;
  }, "");
}

function porExtenso(valor) {
  const total = Math.round((valor || 0) * 100);
  const reais = Math.floor(total / 100), centavos = total % 100;
  const partes = [];
  if (reais) {
    const milhaoRedondo = reais >= 1e6 && reais % 1e6 === 0;
    partes.push(inteiroPorExtenso(reais) + (reais === 1 ? " real" : milhaoRedondo ? " de reais" : " reais"));
  }
  if (centavos) partes.push(inteiroPorExtenso(centavos) + (centavos === 1 ? " centavo" : " centavos"));
  return partes.length ? partes.join(" e ") : "zero real";
}

/* Lê a minuta e devolve nós prontos para o papel:
 *   { t: "titulo" | "clausula" | "par" | "assinaturas", segs?: [...] }
 * Segmento: { t: "txt", v } | { t: "sys", k, v } | { t: "lac", k, v }
 * A numeração das cláusulas é automática, para as opcionais entrarem no
 * meio sem quebrar a sequência. */
const RE_CAMPO = /\{\{\s*([a-z_]+)\.([a-z_]+)\s*\}\}/g;

function segmentar(texto, ctx, campos) {
  const segs = [];
  let ult = 0;
  texto.replace(RE_CAMPO, (m, g, k, pos) => {
    if (pos > ult) segs.push({ t: "txt", v: texto.slice(ult, pos) });
    if (g === "lacuna") segs.push({ t: "lac", k, v: (campos && campos[k]) || "" });
    else segs.push({ t: "sys", k: `${g}.${k}`, v: ctx ? ctx[`${g}.${k}`] : undefined });
    ult = pos + m.length;
    return m;
  });
  if (ult < texto.length) segs.push({ t: "txt", v: texto.slice(ult) });
  return segs;
}

function montarDocumento(corpo, ctx, campos, clausulasMarcadas = []) {
  const nos = [];
  let n = 0, par = [];
  const fechaPar = () => { if (par.length) { nos.push({ t: "par", segs: segmentar(par.join(" "), ctx, campos) }); par = []; } };
  for (const linhaCrua of corpo.split("\n")) {
    const linha = linhaCrua.trim();
    if (!linha) { fechaPar(); continue; }
    if (linha.startsWith("# ")) { fechaPar(); nos.push({ t: "titulo", segs: segmentar(linha.slice(2), ctx, campos) }); continue; }
    if (linha.startsWith("## ")) { fechaPar(); n++; nos.push({ t: "clausula", n, segs: segmentar(linha.slice(3), ctx, campos) }); continue; }
    if (linha === "[clausulas_opcionais]") {
      fechaPar();
      for (const id of clausulasMarcadas) {
        const c = CLAUSULAS[id];
        if (!c) continue;
        n++;
        nos.push({ t: "clausula", n, opcional: true, segs: [{ t: "txt", v: c.titulo }] });
        nos.push({ t: "par", opcional: true, segs: segmentar(c.texto, ctx, campos) });
      }
      continue;
    }
    if (linha === "[assinaturas]") { fechaPar(); nos.push({ t: "assinaturas" }); continue; }
    par.push(linha);
  }
  fechaPar();
  return nos;
}

function chavesDeLacunas(corpo) {
  const vistas = [];
  corpo.replace(RE_CAMPO, (m, g, k) => { if (g === "lacuna" && !vistas.includes(k)) vistas.push(k); return m; });
  return vistas;
}
function chavesDeSistema(corpo) {
  const vistas = [];
  corpo.replace(RE_CAMPO, (m, g, k) => { const c = `${g}.${k}`; if (g !== "lacuna" && !vistas.includes(c)) vistas.push(c); return m; });
  return vistas;
}

/* Lacunas do modelo na ordem em que aparecem no texto, com o metadado
 * declarado (ou um padrão, para a lacuna recém-digitada no editor). */
function lacunasDoModelo(modelo) {
  return chavesDeLacunas(modelo.corpo).map((k) => modelo.lacunas.find((l) => l.chave === k) || { chave: k, rotulo: k.replace(/_/g, " "), tipo: "curto", obrigatoria: true, dica: "" });
}

function contextoDoContrato(db, c) {
  const { parte, ppIds } = c;
  const sol = c.origem === "solicitacao" ? c.solicitacao : null;
  const pps = (ppIds || []).map((id) => ppDe(db, id)).filter(Boolean);
  const job = jobDe(db, c.jobId || (sol && sol.jobId) || pps[0].jobId);
  const cp = parte === "cliente" ? CLIENTES[job.clienteId] : FORNECEDORES[sol ? sol.fornecedorId : pps[0].fornecedorId];
  const valor = parte === "cliente" ? job.valor : sol ? sol.valor : pps.reduce((s, p) => s + p.valor, 0);
  const ctx = {
    "agencia.razao_social": AGENCIA.razao, "agencia.cnpj": AGENCIA.cnpj, "agencia.endereco": AGENCIA.endereco,
    "parte.razao_social": cp.razao, "parte.cnpj": cp.cnpj, "parte.endereco": cp.endereco,
    "job.codigo": job.codigo, "job.nome": job.nome, "job.projeto": `${job.projeto.codigo} — ${job.projeto.nome}`, "job.periodo": `${dataBr(job.inicio)} a ${dataBr(job.fim)}`, "job.cidade": job.cidade, "job.versao": job.versao,
    "pp.codigo": pps.map((p) => p.codigo).join(" e ") || (sol ? c.codigo : "—"), "pp.servico": pps.map((p) => p.servico).join("; ") || (sol ? sol.escopo : "—"),
    "valor.total": moeda(valor), "valor.extenso": porExtenso(valor),
    "pagamento.condicao": parte === "cliente" ? job.condicao : sol ? sol.condicao : pps[0].condicao,
    "responsavel.gp": job.gp, "responsavel.produtor": job.produtor,
    "data.hoje": dataExtenso(HOJE), "foro.cidade": "São Paulo/SP",
    _partes: parte === "cliente" ? [cp.razao, AGENCIA.razao] : [AGENCIA.razao, cp.razao],
    _valor: valor,
  };
  if (c.tipo === "aditivo") {
    const original = contratoDaPP(db, pps[0].id);
    ctx["aditivo.contrato"] = (original.arquivo || "").replace(/-v\d+\.pdf$/, "");
    ctx["aditivo.data_original"] = dataBr(original.assinadoEm);
    ctx["aditivo.valor_anterior"] = moeda(c.aditivo.de);
  }
  return ctx;
}

/* Menu de ações em posição fixa: a tabela vive num overflow-x-auto, e um
 * popover absoluto seria cortado nas últimas linhas. */
function MenuAcoes({ itens, rotulo = "Mais ações" }) {
  const [pos, setPos] = useState(null);
  const btn = useRef(null);
  useEffect(() => {
    if (!pos) return;
    const fechar = () => setPos(null);
    window.addEventListener("scroll", fechar, true);
    window.addEventListener("resize", fechar);
    return () => { window.removeEventListener("scroll", fechar, true); window.removeEventListener("resize", fechar); };
  }, [pos]);
  const abrir = (e) => {
    e.stopPropagation();
    const r = btn.current.getBoundingClientRect();
    const alto = itens.length * 36 + 12;
    const top = r.bottom + alto > window.innerHeight - 8 ? r.top - alto - 4 : r.bottom + 4;
    setPos({ top, left: Math.max(8, Math.min(r.right - 248, window.innerWidth - 256)) });
  };
  return html`<span onClick=${(e) => e.stopPropagation()}>
    <button ref=${btn} type="button" aria-label=${rotulo} aria-haspopup="menu" aria-expanded=${!!pos} onClick=${abrir} class="inline-flex h-7 w-7 items-center justify-center rounded-md text-muted-foreground hover:bg-[#efefef] hover:text-foreground"><${Icon} n="more" /></button>
    ${pos && html`<div class="fixed inset-0 z-[70]" onClick=${() => setPos(null)}></div>
      <div role="menu" class="fixed z-[71] w-[248px] rounded-xl border border-border bg-white p-1.5 shadow-elevated anim-sobe" style=${`top:${pos.top}px;left:${pos.left}px`}>
        ${itens.map((it) => html`<button key=${it.rotulo} type="button" role="menuitem" disabled=${it.desabilitado} onClick=${() => { setPos(null); it.fn(); }}

  </span>`;
}

/* ---------- O papel: a minuta renderizada ---------- */

/* modo "edicao": campos do sistema sublinhados em azul, lacunas
 * preenchidas em verde, lacunas vazias como botão vermelho que leva ao
 * campo. modo "final": texto corrido, como sai no PDF. */
function Papel({ nos, ctx, lacunas, modo = "edicao", onIrLacuna, compacto }) {
  const rotuloLacuna = (k) => (lacunas.find((l) => l.chave === k) || { rotulo: k }).rotulo;
  const seg = (s, i) => {
    if (s.t === "txt") return s.v;
    if (s.t === "sys") {
      const info = ROTULO_CAMPO[s.k];
      if (s.v === undefined) return html`<span key=${i} class="ph ph-erro" title="Campo que o sistema não conhece">{{${s.k}}}</span>`;
      return modo === "final" ? s.v : html`<span key=${i} class="ph ph-sys" title=${`Do sistema · ${info ? info.rotulo + " (" + info.origem + ")" : s.k}`}>${s.v}</span>`;
    }
    if (s.v) return modo === "final" ? s.v : html`<span key=${i} class="ph ph-ok" title=${`Lacuna preenchida · ${rotuloLacuna(s.k)}`}>${s.v}</span>`;
    return html`<button key=${i} type="button" class="ph ph-vazia" onClick=${() => onIrLacuna && onIrLacuna(s.k)} title="Clique para preencher">[${rotuloLacuna(s.k)}]</button>`;
  };
  return html`<article class=${cn("papel", compacto && "papel-compacto")}>
    ${nos.map((no, i) => {
      if (no.t === "titulo") return html`<h3 key=${i} class="papel-titulo">${no.segs.map(seg)}</h3>`;
      if (no.t === "clausula") return html`<h4 key=${i} class=${cn("papel-clausula", no.opcional && modo !== "final" && "papel-opcional")}>CLÁUSULA ${ORDINAL(no.n)} — ${no.segs.map(seg)}${no.opcional && modo !== "final" ? html`<span class="papel-tag">opcional</span>` : null}</h4>`;
      if (no.t === "assinaturas") {
        const [a, b] = ctx && ctx._partes ? ctx._partes : ["CONTRATANTE", "CONTRATADA"];
        return html`<div key=${i} class="papel-assinaturas"><div><span></span>${a}</div><div><span></span>${b}</div></div>`;
      }
      return html`<p key=${i} class=${cn("papel-par", no.opcional && modo !== "final" && "papel-opcional")}>${no.segs.map(seg)}</p>`;
    })}
  </article>`;
}

/* Legenda das marcas do papel. */
function LegendaPapel() {

/* 47-documento.js */
/* ---------- Edição direto no documento (como no Docs ou no Word) ----------
 *
 * O texto continua guardado com marcadores ({{parte.cnpj}}, {{lacuna.objeto}},
 * "## cláusula"), mas quem edita vê o documento. Campos do sistema e lacunas
 * viram blocos que não se digitam por dentro: entram pela barra e saem com
 * Apagar. Na implementação real, isso é um editor como o TipTap/ProseMirror
 * com nós próprios para campo e lacuna; aqui é contenteditable puro.
 *
 * O componente editável é NÃO controlado: o HTML inicial entra uma vez (o
 * `__html` só muda quando a `versao` muda) e cada digitação volta como texto
 * com marcadores. Re-renderizar o conteúdo a cada tecla perderia o cursor. */

const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function chipHtml(chave, lacunas) {
  const [g, k] = chave.split(".");
  if (g === "lacuna") {
    const l = lacunas.find((x) => x.chave === k);
    return `<span class="chip chip-lac" contenteditable="false" data-k="${esc(chave)}" title="Lacuna: preenchida em cada contrato">${esc(l ? l.rotulo : k.replace(/_/g, " "))}</span>`;
  }
  const info = ROTULO_CAMPO[chave];
  if (!info) return `<span class="chip chip-erro" contenteditable="false" data-k="${esc(chave)}" title="O sistema não conhece este campo">${esc(chave)}</span>`;
  return `<span class="chip chip-sys" contenteditable="false" data-k="${esc(chave)}" title="Do sistema · ${esc(info.origem)}">${esc(info.rotulo)}</span>`;
}

function linhaParaHtml(texto, lacunas) {
  let out = "", ult = 0;
  texto.replace(RE_CAMPO, (m, g, k, pos) => { out += esc(texto.slice(ult, pos)) + chipHtml(`${g}.${k}`, lacunas); ult = pos + m.length; return m; });
  return out + esc(texto.slice(ult));
}

const BLOCO_OPCIONAIS = `<div class="bloco-fixo" contenteditable="false" data-t="opcionais">Aqui entram as cláusulas opcionais marcadas em cada contrato</div>`;
const BLOCO_ASSINATURAS = `<div class="bloco-fixo" contenteditable="false" data-t="assinaturas">Assinaturas das partes</div>`;

function corpoParaHtml(corpo, lacunas) {
  const out = [];
  let par = [];
  const fecha = () => { if (par.length) { out.push(`<p>${linhaParaHtml(par.join(" "), lacunas)}</p>`); par = []; } };
  for (const crua of corpo.split("\n")) {
    const l = crua.trim();
    if (!l) { fecha(); continue; }
    if (l.startsWith("# ")) { fecha(); out.push(`<h3>${linhaParaHtml(l.slice(2), lacunas)}</h3>`); continue; }
    if (l.startsWith("## ")) { fecha(); out.push(`<h4>${linhaParaHtml(l.slice(3), lacunas)}</h4>`); continue; }
    if (l === "[clausulas_opcionais]") { fecha(); out.push(BLOCO_OPCIONAIS); continue; }
    if (l === "[assinaturas]") { fecha(); out.push(BLOCO_ASSINATURAS); continue; }
    par.push(l);
  }
  fecha();
  return out.join("");
}

function inlineParaTexto(no) {
  let s = "";
  for (const n of no.childNodes) {
    if (n.nodeType === 3) s += n.textContent.replace(/ /g, " ");
    else if (n.nodeType === 1) {
      if (n.dataset && n.dataset.k) s += `{{${n.dataset.k}}}`;
      else if (n.tagName === "BR") s += " ";
      else s += inlineParaTexto(n);
    }
  }
  return s;
}

function htmlParaCorpo(raiz) {
  const blocos = [];
  for (const el of raiz.childNodes) {
    if (el.nodeType === 3) { const t = el.textContent.replace(/ /g, " ").trim(); if (t) blocos.push(t); continue; }
    if (el.nodeType !== 1) continue;
    if (el.dataset && el.dataset.t === "opcionais") { blocos.push("[clausulas_opcionais]"); continue; }
    if (el.dataset && el.dataset.t === "assinaturas") { blocos.push("[assinaturas]"); continue; }
    if (el.dataset && el.dataset.k) { blocos.push(`{{${el.dataset.k}}}`); continue; }
    const txt = inlineParaTexto(el).replace(/\s+/g, " ").trim();
    if (!txt) continue;
    if (el.tagName === "H3") blocos.push("# " + txt);
    else if (el.tagName === "H4") blocos.push("## " + txt);
    else blocos.push(txt);
  }
  return blocos.join("\n\n");
}

/* Colar sempre como texto: a formatação do Word não entra no contrato. */
function colarComoTexto(e) {
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, t);
}

/* Clique num campo travado: o cursor vai para logo depois dele, em vez de
 * o clique se perder (o bloco não é editável por dentro). */
function cursorDepoisDoBloco(e, raiz) {
  const bloco = e.target.closest && e.target.closest('[contenteditable="false"]');
  if (!bloco || !raiz || bloco === raiz || !raiz.contains(bloco)) return;
  e.preventDefault();
  raiz.focus();
  const r = document.createRange();
  r.setStartAfter(bloco);
  r.collapse(true);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

function usarSelecaoGuardada(ref) {
  const sel = useRef(null);
  useEffect(() => {
    const guardar = () => {
      const s = window.getSelection();
      if (s && s.rangeCount && ref.current && ref.current.contains(s.anchorNode)) sel.current = s.getRangeAt(0).cloneRange();
    };
    document.addEventListener("selectionchange", guardar);
    return () => document.removeEventListener("selectionchange", guardar);
  }, []);
  const restaurar = () => {
    const el = ref.current;
    el.focus();
    const s = window.getSelection();
    let r = sel.current;
    if (!r || !el.contains(r.startContainer)) { r = document.createRange(); r.selectNodeContents(el); r.collapse(false); }
    s.removeAllRanges();
    s.addRange(r);
    return r;
  };
  return restaurar;
}

const BOTAO_BARRA = "inline-flex h-8 items-center gap-1.5 rounded-md px-2.5 text-[12.5px] font-semibold text-foreground hover:bg-[#f1f1ef] disabled:opacity-40";

/* Editor de MODELO: a minuta inteira, com campos e lacunas como blocos. */
function EditorDocumento({ corpo, lacunas, versao, onMuda, onNovaLacuna }) {
  const ref = useRef(null);
  const restaurar = usarSelecaoGuardada(ref);
  const [menuCampo, setMenuCampo] = useState(false);
  const [novaLacuna, setNovaLacuna] = useState(null);
  const inicial = useMemo(() => ({ __html: corpoParaHtml(corpo, lacunas) }), [versao]);

  // O rótulo da lacuna, editado na lista ao lado, acompanha no documento.
  useEffect(() => {
    if (!ref.current) return;
    ref.current.querySelectorAll('[data-k^="lacuna."]').forEach((el) => {
      const l = lacunas.find((x) => x.chave === el.dataset.k.slice(7));
      if (l && el.textContent !== l.rotulo) el.textContent = l.rotulo;
    });
  });

  const sincronizar = () => onMuda(htmlParaCorpo(ref.current));
  const bloco = (tag) => { restaurar(); document.execCommand("formatBlock", false, tag); sincronizar(); };
  const inserirChip = (chave, lacs = lacunas) => {
    const r = restaurar();
    r.deleteContents();
    const tmp = document.createElement("span");
    tmp.innerHTML = chipHtml(chave, lacs);
    const chip = tmp.firstChild;
    const espaco = document.createTextNode(" ");
    r.insertNode(espaco);
    r.insertNode(chip);
    const depois = document.createRange();
    depois.setStartAfter(espaco);
    depois.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(depois);
    sincronizar();
  };
  const confirmarLacuna = () => {
    const rot = (novaLacuna || "").trim();
    if (!rot) return;
    const { chave, lacunas: novas } = onNovaLacuna(rot);
    setNovaLacuna(null);
    inserirChip(`lacuna.${chave}`, novas);
  };
  const semRoubarFoco = (e) => e.preventDefault();

  return html`<div class="mx-auto max-w-[760px]">
    <div class="barra-doc sticky top-0 z-10 mb-3 flex flex-wrap items-center gap-0.5 rounded-xl border border-border bg-white p-1 shadow-soft">
      <button type="button" class=${BOTAO_BARRA} onMouseDown=${semRoubarFoco} onClick=${() => bloco("h3")} title="Título do contrato">Título</button>
      <button type="button" class=${BOTAO_BARRA} onMouseDown=${semRoubarFoco} onClick=${() => bloco("h4")} title="Começa uma cláusula. A numeração é automática.">Cláusula</button>
      <button type="button" class=${BOTAO_BARRA} onMouseDown=${semRoubarFoco} onClick=${() => bloco("p")} title="Texto corrido">Texto</button>
      <span class="mx-1 h-5 w-px bg-border"></span>
      <div class="relative">
        <button type="button" class=${BOTAO_BARRA} onMouseDown=${semRoubarFoco} onClick=${() => setMenuCampo(!menuCampo)} aria-expanded=${menuCampo}><span class="h-2.5 w-2.5 rounded-sm border border-[#9dbbe9] bg-[#eef4fd]"></span>Campo do sistema<${Icon} n="chevronDown" c="h-3 w-3" /></button>
        ${menuCampo && html`<div class="fixed inset-0 z-[60]" onMouseDown=${semRoubarFoco} onClick=${() => setMenuCampo(false)}></div>
          <div class="absolute left-0 top-[calc(100%+6px)] z-[61] max-h-[340px] w-[300px] overflow-y-auto rounded-xl border border-border bg-white p-1.5 shadow-elevated">
            ${CAMPOS_SISTEMA.map((g) => html`<div key=${g.grupo}><p class="px-2.5 pb-1 pt-2 text-[10px] font-bold uppercase tracking-[0.14em] text-muted-foreground">${g.grupo}</p>
              ${g.itens.map(([k, r, o]) => html`<button key=${k} type="button" onMouseDown=${semRoubarFoco} onClick=${() => { setMenuCampo(false); inserirChip(k); }} class="flex w-full items-center justify-between gap-2 rounded-lg px-2.5 py-1.5 text-left text-[12.5px] hover:bg-[#f4f4f2]"><span>${r}</span><span class="text-[10.5px] text-muted-foreground">${o}</span></button>`)}
            </div>`)}
          </div>`}
      </div>
      ${novaLacuna === null ? html`<button type="button" class=${BOTAO_BARRA} onMouseDown=${semRoubarFoco} onClick=${() => setNovaLacuna("")}><span class="h-2.5 w-2.5 rounded-sm border border-dashed border-[#f3a3aa] bg-[#fdecee]"></span>Lacuna</button>`
        : html`<span class="inline-flex items-center gap-1 px-1"><input id="nova-lacuna" autoFocus value=${novaLacuna} onInput=${(e) => setNovaLacuna(e.target.value)} onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); confirmarLacuna(); } if (e.key === "Escape") setNovaLacuna(null); }} placeholder="Nome da lacuna" class="h-7 w-40 rounded-md border border-border px-2 text-[12px] outline-none focus:border-california-red/50" /><${Botao} t="xs" onMouseDown=${semRoubarFoco} onClick=${confirmarLacuna}>Inserir</${Botao}></span>`}
    </div>
    <article id="mod-documento" ref=${ref} class="papel doc-livre doc-editando" contenteditable="true" spellcheck="true" aria-label="Texto da minuta"
      onFocus=${() => document.execCommand("defaultParagraphSeparator", false, "p")}
      onMouseDown=${(e) => cursorDepoisDoBloco(e, ref.current)}
      onInput=${sincronizar} onPaste=${(e) => { colarComoTexto(e); sincronizar(); }}
      dangerouslySetInnerHTML=${inicial}></article>
    <p class="mt-3 text-center text-[11.5px] leading-relaxed text-muted-foreground">Escreva direto no documento. Campos do sistema (azul) e lacunas (vermelho) entram pela barra e saem com Apagar. A numeração das cláusulas é automática.</p>
  </div>`;
}

/* O contrato já montado, em HTML: os dados do sistema continuam travados
 * (vêm do cadastro e da PP); o resto vira texto que se edita livremente. */
function contratoParaHtml(nos, ctx) {
  const seg = (s) => s.t === "txt" ? esc(s.v) : s.t === "sys" ? `<span class="ph ph-sys" contenteditable="false" data-k="${esc(s.k)}" title="Do sistema: corrija no cadastro ou na PP">${esc(s.v ?? "")}</span>` : esc(s.v || "");
  return nos.map((no) => {
    const segs = (no.segs || []).map(seg).join("");
    if (no.t === "titulo") return `<h3>${segs}</h3>`;
    if (no.t === "clausula") return `<h4>${segs}</h4>`;
    if (no.t === "par") return `<p>${segs}</p>`;
    if (no.t === "assinaturas") { const [a, b] = ctx._partes; return `<div class="papel-assinaturas" contenteditable="false"><div><span></span>${esc(a)}</div><div><span></span>${esc(b)}</div></div>`; }
    return "";
  }).join("");
}

/* O contrato editável. `htmlInicial` precisa ficar estável enquanto se
 * edita: quem chama guarda o HTML do momento em que a edição começou. */
function ContratoEditavel({ htmlInicial, editavel, onMuda }) {
  const ref = useRef(null);
  const inicial = useMemo(() => ({ __html: htmlInicial }), [htmlInicial]);
  return html`<article ref=${ref} class=${cn("papel doc-livre", editavel ? "doc-editando" : "doc-final")} contenteditable=${editavel ? "true" : "false"} aria-label="Texto do contrato"
    onFocus=${() => editavel && document.execCommand("defaultParagraphSeparator", false, "p")}
    onMouseDown=${(e) => editavel && cursorDepoisDoBloco(e, ref.current)}
    onInput=${() => onMuda && onMuda(ref.current.innerHTML)} onPaste=${(e) => { if (!editavel) return; colarComoTexto(e); onMuda && onMuda(ref.current.innerHTML); }}
    dangerouslySetInnerHTML=${inicial}></article>`;
}

function Sidebar() {
  const { ui, ir, db } = useStore();
  const [hover, setHover] = useState(false);
  const [mob, setMob] = useState(false);
  const exp = hover || mob;
  const pendentes = contratosEmAberto(db).filter((c) => c.status === "pendente").length;
  const links = [
    { k: "home", rot: "Home", ic: "home" },
    { k: "orcamentos", rot: "Orçamentos", ic: "fileText" },
    { k: "jobs", rot: "Jobs", ic: "briefcase" },
    { k: "suprimentos", rot: "Suprimentos", ic: "package" },
    { k: "juridico", rot: "Jurídico", ic: "scale", badge: pendentes, novo: true },
    { k: "desembolsos", rot: "Desembolsos", ic: "wallet" },
    { k: "financeiro", rot: "Financeiro", ic: "landmark" },
    { k: "relatorios", rot: "Relatórios", ic: "barChart" },
    { k: "rh", rot: "RH", ic: "users" },
    { k: "freelancers", rot: "Freelancers", ic: "userCheck" },
  ];
  const ativo = ui.tela === "job" ? "jobs" : ui.tela;
  const larguraItem = exp ? 232 : 44;
  const trans = "transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)]";
  return html`
    <button type="button" class="menu-movel fixed z-50 rounded-lg bg-california-dark p-2.5 text-white shadow-elevated md:hidden" onClick=${() => setMob(!mob)} aria-label=${mob ? "Fechar menu" : "Abrir menu"}><${Icon} n=${mob ? "x" : "menu"} c="h-5 w-5" /></button>
    ${mob && html`<div class="fixed inset-0 z-30 bg-black/40 backdrop-blur-sm md:hidden" onClick=${() => setMob(false)}></div>`}
    <aside onMouseEnter=${() => setHover(true)} onMouseLeave=${() => setHover(false)}
      class=${cn("barra-lateral scrollbar-dark fixed inset-y-0 left-0 z-40 flex flex-col bg-california-dark text-white", trans, "w-64 -translate-x-full md:translate-x-0", mob && "translate-x-0", exp ? "md:w-64" : "md:w-[76px]", hover && "md:shadow-2xl md:shadow-black/30")}>
      <div class="px-3 pb-5 pt-6">
        <div class="flex items-center gap-3">
          <img src=${LOGO} alt="Agência California" width="48" height="48" class="h-12 w-12 shrink-0 object-contain" />
          <div class=${cn("min-w-0 overflow-hidden", trans, exp ? "opacity-100" : "pointer-events-none -translate-x-2 opacity-0")}>
            <p class="whitespace-nowrap text-[10px] font-medium uppercase tracking-[0.18em] text-white/50">Agência</p>
            <p class="mt-1 whitespace-nowrap font-display text-xl font-semibold leading-none tracking-tight">California</p>
          </div>
        </div>
      </div>
      <div class="px-4"><div class="h-px bg-white/10"></div></div>
      <nav class="scrollbar-dark flex-1 space-y-1 overflow-y-auto overflow-x-hidden px-3 py-5">
        <p class=${cn("mb-3 px-3 text-[10px] font-semibold uppercase tracking-[0.16em] text-white/40", trans, exp ? "opacity-100" : "opacity-0")}>Menu</p>
        ${links.map((l) => {
          const on = ativo === l.k;
          return html`<button key=${l.k} type="button" title=${exp ? undefined : l.rot} onClick=${() => { setMob(false); ir(l.k); }} class="group block w-full text-left">
            <div style=${`width:${larguraItem}px`} class=${cn("relative flex h-11 shrink-0 items-center overflow-hidden rounded-lg text-sm font-medium", trans, on ? "bg-[#3E3E3E] text-white" : "text-white/60 group-hover:bg-white/5 group-hover:text-white")}>
              ${on && html`<span class="absolute inset-y-0 left-0 w-1 bg-california-red"></span>`}
              <div class="relative flex h-full w-11 shrink-0 items-center justify-center">
                <${Icon} n=${l.ic} c=${cn("h-[18px] w-[18px] transition-colors", on ? "text-california-red" : "text-white/50 group-hover:text-white/80")} />
                ${l.badge > 0 && !exp && html`<span class="absolute right-1.5 top-2 h-2 w-2 rounded-full bg-california-red ring-2 ring-california-dark"></span>`}
              </div>
              <div class=${cn("flex min-w-0 flex-1 items-center gap-2 pr-3", trans, exp ? "opacity-100" : "opacity-0")}>
                <span class="flex-1 truncate whitespace-nowrap">${l.rot}</span>
                ${l.novo && html`<span class="rounded bg-white/10 px-1.5 py-px text-[9px] font-bold uppercase tracking-wider text-white/70">novo</span>`}
                ${l.badge > 0 && html`<span class="inline-flex h-[18px] min-w-[18px] items-center justify-center rounded-full bg-california-red px-1 text-[10px] font-bold text-white">${l.badge}</span>`}
              </div>
            </div>
          </button>`;
        })}
      </nav>
      <div class="px-4"><div class="h-px bg-white/10"></div></div>
      <div class="flex items-center gap-3 px-4 py-4">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-white/10 text-[13px] font-bold">${iniciais(USUARIO.nome)}</span>
        <div class=${cn("min-w-0", trans, exp ? "opacity-100" : "opacity-0")}>
          <p class="truncate whitespace-nowrap text-[13px] font-semibold">${USUARIO.nome}</p>
          <p class="whitespace-nowrap text-[11px] text-white/50">${USUARIO.papel}</p>
        </div>
      </div>
    </aside>`;
}

/* ---------- Barra do protótipo (não faz parte do ERP) ---------- */

function BarraPrototipo({ onNotas }) {
  const { acoes, reiniciar } = useStore();
  const [menu, setMenu] = useState(false);
  return html`<div class="barra-proto fixed z-[45] flex max-w-[calc(100vw-24px)] items-center gap-1.5 rounded-2xl border border-[#3a3a3a] bg-[#1d1d1d]/95 p-1.5 text-white shadow-2xl backdrop-blur">
    <span class="hidden items-center gap-1.5 pl-2 pr-1 text-[10px] font-bold uppercase tracking-[0.16em] text-white/50 lg:inline-flex"><span class="h-1.5 w-1.5 rounded-full bg-california-red"></span>Protótipo</span>
    <div class="relative">
      <button type="button" aria-haspopup="menu" aria-expanded=${menu} onClick=${() => setMenu(!menu)} class="inline-flex h-10 items-center gap-1.5 rounded-xl px-3 text-[12.5px] font-semibold text-white/85 hover:bg-white/10"><${Icon} n="zap" c="h-4 w-4 text-[#fbbf24]" /><span class="hidden sm:inline">Simular</span><${Icon} n="chevronDown" c="h-3.5 w-3.5 text-white/50" /></button>
      ${menu && html`<div class="fixed inset-0 z-[56]" onClick=${() => setMenu(false)}></div>
        <div role="menu" class="absolute bottom-[calc(100%+8px)] left-1/2 z-[57] w-[300px] -translate-x-1/2 rounded-xl border border-border bg-white p-1.5 text-foreground shadow-elevated anim-sobe">
          <p class="px-2.5 pb-1 pt-1.5 text-[10px] font-bold uppercase tracking-[0.14em] text-muted-foreground">Gatilhos do módulo</p>
          <button type="button" role="menuitem" onClick=${() => { setMenu(false); acoes.simularJob(); }} class="flex w-full gap-2.5 rounded-lg px-2.5 py-2 text-left hover:bg-[#f4f4f2]"><${Icon} n="briefcase" c="mt-0.5 h-4 w-4 text-muted-foreground" /><span><span class="block text-[13px] font-semibold">Financeiro abre um job</span><span class="block text-[11.5px] text-muted-foreground">Orçamento aprovado vira contrato com o cliente</span></span></button>
          <button type="button" role="menuitem" onClick=${() => { setMenu(false); acoes.simularPP(); }} class="flex w-full gap-2.5 rounded-lg px-2.5 py-2 text-left hover:bg-[#f4f4f2]"><${Icon} n="package" c="mt-0.5 h-4 w-4 text-muted-foreground" /><span><span class="block text-[13px] font-semibold">Suprimentos gera uma PP</span><span class="block text-[11.5px] text-muted-foreground">PP gerada vira contrato com o fornecedor</span></span></button>
          <div class="my-1 h-px bg-border"></div>
          <button type="button" role="menuitem" onClick=${() => { setMenu(false); reiniciar(); }} class="flex w-full items-center gap-2.5 rounded-lg px-2.5 py-2 text-left text-[13px] font-medium hover:bg-[#f4f4f2]"><${Icon} n="rotate" c="h-4 w-4 text-muted-foreground" />Recomeçar com os dados de exemplo</button>
        </div>`}
    </div>
    <button type="button" onClick=${onNotas} class="inline-flex h-10 items-center gap-1.5 rounded-xl px-3 text-[12.5px] font-semibold text-white/85 hover:bg-white/10"><${Icon} n="sparkles" c="h-4 w-4 text-[#f9a8b0]" /><span class="hidden sm:inline">Além do pedido</span><span class="sm:hidden">Guia</span></button>
  </div>`;
}

/* 60-entrada.js */
/* ---------- Aba 1: Caixa de entrada ---------- */

const LIMITE_DISPENSA = 5000;

function linhasDaEntrada(db) {
  return contratosEmAberto(db).map((c) => infoContrato(db, c));
}

/* Outras PPs do mesmo fornecedor no mesmo job, ainda sem contrato. */
function ppsIrmasSemContrato(db, info) {
  if (info.c.parte !== "fornecedor" || info.c.tipo === "aditivo" || info.origem === "solicitacao") return [];
  return db.pps.filter((p) => p.jobId === info.job.id && p.fornecedorId === info.pp.fornecedorId && !info.c.ppIds.includes(p.id) && p.status !== "pago").filter((p) => {
    const c = contratoDaPP(db, p.id);
    return c && c.status === "pendente" && c.ppIds.length === 1;
  });
}

function etiquetas(db, info) {
  const out = [];
  if (info.c.tipo === "aditivo") out.push(html`<${Etiqueta} cor="roxo" icone="layers">${moeda(info.c.aditivo.de)} → ${moeda(info.c.aditivo.para)}</${Etiqueta}>`);
  const irmas = ppsIrmasSemContrato(db, info);
  if (irmas.length) out.push(html`<${Etiqueta} cor="roxo" icone="link">+${irmas.length} PP do mesmo fornecedor</${Etiqueta}>`);
  if (info.contraparte.quadro && info.c.tipo !== "aditivo") out.push(html`<${Etiqueta} cor="verde" icone="shield">Contrato-quadro ${info.contraparte.quadro.codigo}</${Etiqueta}>`);
  if (info.c.parte === "fornecedor" && info.c.tipo !== "aditivo" && info.valor < LIMITE_DISPENSA) out.push(html`<${Etiqueta} cor="cinza">Abaixo do limite</${Etiqueta}>`);
  if (info.origem === "solicitacao") out.push(html`<${Etiqueta} cor="azul" icone="message">Pedido de ${info.c.solicitacao.solicitante}</${Etiqueta}>`);
  return out;
}

function rotuloAcao(status) {
  return status === "pendente" ? "Elaborar" : status === "elaboracao" ? "Continuar" : "Ver";
}

function Kpis({ db, linhas, filtro, onFiltro }) {
  const n = (s) => linhas.filter((l) => l.c.status === s).length;
  const travadas = db.pps.filter((p) => situacaoPagamento(db, p).k === "travado");
  const valorTravado = travadas.reduce((s, p) => s + p.valor, 0);
  const cli = linhas.filter((l) => l.c.status === "pendente" && l.c.parte === "cliente").length;
  const tiles = [
    { k: "pendente", rot: "Pendentes", v: n("pendente"), sub: `${cli} de clientes · ${n("pendente") - cli} de fornecedores` },
    { k: "elaboracao", rot: "Em elaboração", v: n("elaboracao"), sub: "Rascunhos salvos" },
    { k: "assinatura", rot: "Aguardando assinatura", v: n("assinatura"), sub: "Gerados, sem o assinado anexado" },
    { k: "travado", rot: "Pagamentos travados", v: moeda(valorTravado), sub: `${travadas.length} PPs aprovadas pelo financeiro sem contrato`, alerta: true },
  ];
  return html`<div class="grid grid-cols-2 gap-3 xl:grid-cols-4">
    ${tiles.map((t) => {
      const on = filtro === t.k;
      return html`<button key=${t.k} type="button" aria-pressed=${on} onClick=${() => onFiltro(on ? "todos" : t.k)}
        class=${cn("min-w-0 rounded-2xl border p-4 text-left shadow-soft transition-colors", t.alerta ? "border-california-red/30 bg-[#fffafa] hover:bg-[#fff3f4]" : "border-border bg-white hover:bg-[#fcfcfb]", on && "ring-2 ring-california-red/35")}>
        <p class=${cn("flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-[0.1em]", t.alerta ? "text-[#b3323c]" : "text-muted-foreground")}>${t.alerta && html`<${Icon} n="lock" c="h-3.5 w-3.5" />`}${t.rot}</p>
        <p class=${cn("mt-1.5 truncate text-[21px] sm:text-[26px] font-bold leading-none tracking-tight tabular-nums", t.alerta && "text-[#b3323c]")}>${t.v}</p>
        <p class="mt-2 text-[12px] leading-snug text-muted-foreground">${t.sub}</p>
      </button>`;
    })}
  </div>`;
}

function Entrada() {
  const { db, ui, setUi, abrirContrato, irJob, abrirModal } = useStore();
  const f = ui.entrada;
  const setF = (patch) => setUi((u) => ({ ...u, entrada: { ...u.entrada, ...patch } }));

  let linhas = todas.filter((l) => (f.origem === "todos" ? true : l.c.parte === f.origem));

      <${Segmentado} rotulo="Origem" valor=${f.origem} onTroca=${(v) => setF({ origem: v })} opcoes=${[
        { k: "todos", rotulo: "Todos", n: contagem("todos") },

/* ---------- Aba 2: Contratos por job ---------- */

function contratosDoJob(db, jobId) {
  const ppsDoJob = db.pps.filter((p) => p.jobId === jobId).map((p) => p.id);
  return db.contratos.filter((c) => (c.parte === "cliente" || c.origem === "solicitacao" ? c.jobId === jobId : c.ppIds.some((id) => ppsDoJob.includes(id))));
}

function resumoDoJob(db, jobId) {
  const cs = contratosDoJob(db, jobId);
  const resolvidos = cs.filter((c) => RESOLVIDO.includes(c.status)).length;
  return { total: cs.length, resolvidos, cs };
}

function AcoesDoContrato({ c, compacto }) {

      <p class="truncate text-[13px] font-semibold" title=${titulo}>${titulo}</p>

    <${SeloContrato} status=${c.status} />
    <${AcoesDoContrato} c=${c} compacto />
  </div>`;
}

/* 80-gerar.js */
/* ---------- Elaborar contrato (gaveta) e visualizar contrato ---------- */

function modelosPara(db, c) {
  return db.modelos.filter((m) => m.ativo && m.parte === c.parte && (c.tipo === "aditivo" ? m.tipo === "aditivo" : m.tipo !== "aditivo"));
}

function modeloSugerido(db, c, info) {
  if (c.tipo === "aditivo") return "m-aditivo";
  if (c.parte === "cliente") return "m-cli-prod";
  const tipo = info.pp ? info.pp.tipo : "prestacao";
  const lista = modelosPara(db, c).filter((m) => m.tipo === tipo);
  if (info.pp && /motorista|van|caminh/i.test(info.pp.servico + info.pp.especificacoes)) return "m-forn-veic";
  return lista[0] ? lista[0].id : null;
}

function minusculaInicial(t) { return t ? t[0].toLowerCase() + t.slice(1) : t; }

/* O que a PP já diz vira sugestão para a lacuna de objeto. */
function sugestaoDeObjeto(info, ppIds, db) {
  if (info.c.tipo === "aditivo") return info.c.aditivo.motivo.replace(/^PP-\d+ reemitida pela produção: /, "");
  if (info.c.parte === "cliente") return `produção da ${info.job.servico.toLowerCase()} “${info.job.nome}”`;
  if (info.origem === "solicitacao") return info.c.solicitacao.escopo;
  return ppIds.map((id) => ppDe(db, id)).map((p) => `${minusculaInicial(p.servico)} (${p.especificacoes})`).join("; ");
}

function rotuloDestino(info, ppIds, db) {
  if (info.c.parte === "cliente") return `Informações do job ${info.job.codigo}`;
  if (info.origem === "solicitacao") return `${info.job.codigo} (Informações do job)`;
  return `${ppIds.map((id) => ppDe(db, id).codigo).join(" e ")} (aba PPs do ${info.job.codigo})`;
}

          <${SeloContrato} status=${info.c.status} />

        <p class="truncate text-[13px] text-muted-foreground">${info.job.codigo} · ${info.job.nome} · ${CLIENTES[info.job.clienteId].fantasia}</p>
      </div>
      <button type="button" onClick=${onFechar} aria-label="Fechar" class="rounded-lg p-1.5 text-muted-foreground hover:bg-muted hover:text-foreground"><${Icon} n="x" c="h-5 w-5" /></button>
    </div>
    ${passos ? html`<ol class="mt-4 flex items-center gap-1 overflow-x-auto">
      ${passos.map((p, i) => {
        const n = i + 1, on = passo === n, feito = passo > n;
        return html`<li key=${p} class="flex items-center gap-1">
          <button type="button" disabled=${n > passo} onClick=${() => onPasso(n)} class=${cn("inline-flex items-center gap-2 border-b-2 px-2 pb-3 pt-1 text-[13px] font-semibold disabled:cursor-default", on ? "border-california-red text-foreground" : feito ? "border-transparent text-foreground hover:text-california-red" : "border-transparent text-muted-foreground")}>
            <span class=${cn("inline-flex h-5 w-5 items-center justify-center rounded-full text-[11px] font-bold", on ? "bg-california-red text-white" : feito ? "bg-emerald-500 text-white" : "bg-[#ececea] text-muted-foreground")}>${feito ? html`<${Icon} n="check" c="h-3 w-3" sw="3" />` : n}</span>${p}
          </button>
          ${i < passos.length - 1 && html`<${Icon} n="chevronRight" c="mb-3 h-4 w-4 text-[#cfcfcf]" />`}
        </li>`;
      })}
    </ol>` : html`<div class="h-4"></div>`}
  </div>`;
}

function DadosDoSistema({ info, ctx }) {
  const linhas = [
    [info.c.parte === "cliente" ? "Contratante" : "Contratada", info.contraparte.razao, info.c.parte === "cliente" ? "Cadastro do cliente" : "Cadastro do fornecedor"],
    ["CNPJ", info.contraparte.cnpj, "Cadastro"],
    ["Endereço", info.contraparte.endereco, "Cadastro"],
    ["Valor", `${ctx["valor.total"]} (${ctx["valor.extenso"]})`, info.c.parte === "cliente" ? "Versão aprovada do orçamento" : info.origem === "solicitacao" ? "Solicitação" : "PP"],
    ["Condição de pagamento", ctx["pagamento.condicao"], info.c.parte === "cliente" ? "Orçamento" : "PP"],
    ["Job", `${info.job.codigo} · ${info.job.nome}`, "Job"],
    ["Período do job", ctx["job.periodo"], "Job"],
    [info.c.parte === "cliente" ? "Gerente de projetos" : "Produtor responsável", info.c.parte === "cliente" ? info.job.gp : info.job.produtor, "Job"],
  ];
  return html`<div class="rounded-2xl border border-border bg-white shadow-soft">
    <div class="flex items-center gap-2 border-b border-border px-5 py-3"><${Icon} n="lock" c="h-3.5 w-3.5 text-muted-foreground" /><p class="text-[13px] font-bold">Dados que o sistema já preenche</p><span class="text-[12px] text-muted-foreground">· vêm do cadastro, do job e da ${info.c.parte === "cliente" ? "versão aprovada" : "PP"}</span></div>
    <dl class="grid gap-x-6 gap-y-3 px-5 py-4 sm:grid-cols-2">
      ${linhas.map(([k, v, o]) => html`<div key=${k} class="min-w-0"><dt class="text-[11px] font-semibold uppercase tracking-[0.08em] text-muted-foreground">${k}</dt><dd class="mt-0.5 text-[13px] font-medium leading-snug">${v}</dd><dd class="text-[11px] text-muted-foreground/80">${o}</dd></div>`)}
    </dl>
  </div>`;
}

function GerarContrato({ id, onFechar, passoInicial }) {
  const { db, acoes, irJob, abrirModal } = useStore();
  const c = db.contratos.find((x) => x.id === id);
  const info = infoContrato(db, c);
  const [modeloId, setModeloId] = useState(c.modeloId || modeloSugerido(db, c, info));
  const [passo, setPasso] = useState(c.modeloId ? 2 : passoInicial && modeloId ? passoInicial : 1);
  const [filtroTipo, setFiltroTipo] = useState("todos");
  const [campos, setCampos] = useState({ ...(c.campos || {}) });
  const [clausulas, setClausulas] = useState(c.clausulas || []);
  const [ppIds, setPpIds] = useState(c.ppIds || []);
  // Texto ajustado à mão na revisão (pedido de 21/10/2026: editar direto no contrato).
  const [textoEditado, setTextoEditado] = useState(c.textoEditado || null);
  const [editando, setEditando] = useState(false);
  const [baseEdicao, setBaseEdicao] = useState(null);
  const corpoRef = useRef(null);

  const modelo = modeloId ? modeloDe(db, modeloId) : null;
  const ctx = contextoDoContrato(db, { ...c, ppIds });
  const lacunas = modelo ? lacunasDoModelo(modelo) : [];
  const faltando = lacunas.filter((l) => l.obrigatoria && !(campos[l.chave] || "").trim());
  const nos = modelo ? montarDocumento(modelo.corpo, ctx, campos, clausulas) : [];
  const irmas = ppsIrmasSemContrato(db, info);
  const disponiveis = modelosPara(db, c);
  const tiposVisiveis = ORDEM_TIPOS.filter((t) => (c.tipo === "aditivo" ? t === "aditivo" : t !== "aditivo"));
  const sugerido = modeloSugerido(db, c, info);

  const irLacuna = (k) => {
    const el = document.getElementById(`lac-${k}`);
    if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.focus(); }
  };
  const dadosParaSalvar = () => ({ modeloId, modeloVersao: modelo.versao, modeloNome: modelo.nome, campos, clausulas, ppIds, valor: ctx._valor, textoEditado });
  const comecarEdicao = () => { setBaseEdicao(textoEditado || contratoParaHtml(nos, ctx)); setEditando(true); };
  const destino = rotuloDestino(info, ppIds, db);
  const irParaJob = () => { onFechar(); irJob(info.job.id, c.parte === "cliente" || info.origem === "solicitacao" ? "info" : "pps"); };

  const escolherModelo = (m) => {
    setModeloId(m.id);
    setClausulas((atual) => (c.modeloId === m.id ? atual : []));
  };

  /* ----- Passo 1: modelo ----- */
  const passo1 = html`<div class="mx-auto max-w-[1180px] space-y-5 px-6 py-6">
    <${DadosDoSistema} info=${info} ctx=${ctx} />

    ${irmas.length > 0 && html`<div class="rounded-2xl border border-[#e9d5ff] bg-[#fdfaff] px-5 py-4">
      <p class="flex items-center gap-2 text-[13px] font-bold text-[#6b21a8]"><${Icon} n="link" />Mesmo fornecedor, mesmo job</p>
      <p class="mt-1 text-[12.5px] text-[#6b5a7a]">${info.contraparte.nome} tem outra PP neste job ainda sem contrato. Dá para cobrir as duas num contrato só.</p>
      <div class="mt-3 space-y-2">${irmas.map((p) => {
        const on = ppIds.includes(p.id);
        return html`<label key=${p.id} class="flex cursor-pointer items-center gap-3 rounded-xl border border-[#e9d5ff] bg-white px-3.5 py-2.5">
          <input id=${`incluir-${p.id}`} type="checkbox" checked=${on} onChange=${() => setPpIds(on ? ppIds.filter((x) => x !== p.id) : [...ppIds, p.id])} class="h-4 w-4 accent-[#E74B56]" />
          <span class="min-w-0 flex-1 text-[13px]"><span class="font-mono font-semibold">${p.codigo}</span> · ${p.servico} <span class="text-muted-foreground">· ${p.condicao}</span></span>
          <span class="font-semibold tabular-nums">${moeda(p.valor)}</span>
        </label>`;
      })}</div>
      ${ppIds.length > 1 && html`<p class="mt-2.5 text-[12.5px] font-semibold text-[#6b21a8]">Valor do contrato: ${moeda(ctx._valor)} (${ppIds.length} PPs)</p>`}
    </div>`}

    ${info.contraparte.quadro && c.tipo !== "aditivo" && info.origem !== "solicitacao" && html`<div class="flex flex-wrap items-center gap-4 rounded-2xl border border-emerald-200 bg-emerald-50/60 px-5 py-4">
      <${Icon} n="shield" c="h-5 w-5 text-emerald-700" />
      <div class="min-w-0 flex-1"><p class="text-[13px] font-bold text-emerald-800">Contrato-quadro ${info.contraparte.quadro.codigo} vigente até ${dataBr(info.contraparte.quadro.vigencia)}</p><p class="text-[12.5px] text-emerald-900/70">${info.contraparte.quadro.objeto}. A PP pode ser vinculada a ele, sem contrato novo.</p></div>
      <${Botao} v="secundario" t="sm" icone="shield" onClick=${() => abrirModal({ tipo: "quadro", id: c.id })}>Vincular ao contrato-quadro</${Botao}>
    </div>`}

    <div>
      <div class="mb-3 flex flex-wrap items-end justify-between gap-3">
        <div><h3 class="text-[15px] font-bold">Escolha o modelo</h3><p class="text-[12.5px] text-muted-foreground">${c.parte === "cliente" ? "Modelos para contratos com o cliente." : "Modelos para contratos com fornecedores."} O modelo traz a minuta pronta; você só preenche as lacunas.</p></div>
        <div class="flex flex-wrap gap-1.5">
          ${["todos", ...tiposVisiveis].map((t) => html`<button key=${t} type="button" aria-pressed=${filtroTipo === t} onClick=${() => setFiltroTipo(t)} class=${cn("rounded-full border px-3 py-1 text-[12px] font-semibold", filtroTipo === t ? "border-california-dark bg-california-dark text-white" : "border-border bg-white text-muted-foreground hover:text-foreground")}>${t === "todos" ? "Todos os tipos" : TIPOS[t].rotulo}</button>`)}
        </div>
      </div>
      <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        ${tiposVisiveis.filter((t) => filtroTipo === "todos" || filtroTipo === t).flatMap((t) => {
          const ms = disponiveis.filter((m) => m.tipo === t);
          return ms.map((m) => {
            const on = modeloId === m.id;
            const lac = lacunasDoModelo(m);
            return html`<button key=${m.id} type="button" aria-pressed=${on} onClick=${() => escolherModelo(m)}
              class=${cn("relative flex min-h-[148px] flex-col rounded-2xl border bg-white p-4 text-left transition-shadow", on ? "border-california-red shadow-[0_0_0_3px_rgba(231,75,86,0.15)]" : "border-border hover:border-[#d6d6d6] hover:shadow-soft")}>
              <div class="flex items-center justify-between gap-2">
                <p class="text-[11px] font-semibold uppercase tracking-[0.08em] text-muted-foreground">${TIPOS[m.tipo].rotulo}</p>
                ${on ? html`<span class="inline-flex h-5 w-5 items-center justify-center rounded-full bg-california-red text-white"><${Icon} n="check" c="h-3 w-3" sw="3" /></span>` : sugerido === m.id ? html`<${Etiqueta} cor="azul" icone="sparkles">Sugerido pela PP</${Etiqueta}>` : null}
              </div>
              <p class="mt-1.5 text-[14px] font-bold leading-snug">${m.nome}</p>
              <p class="mt-1 line-clamp-2 text-[12.5px] leading-snug text-muted-foreground">${m.descricao}</p>
              <div class="mt-auto flex flex-wrap items-center gap-x-3 gap-y-1 pt-3 text-[11.5px] text-muted-foreground">
                <span>${lac.length} ${lac.length === 1 ? "lacuna" : "lacunas"}</span>
                ${html`<span>v${m.versao}</span>`}
                <span>Usado ${m.usos} ${m.usos === 1 ? "vez" : "vezes"}</span>
                ${m.rascunho && html`<${Etiqueta} cor="ambar">Rascunho</${Etiqueta}>`}
              </div>
            </button>`;
          });
        })}
      </div>
    </div>
    ${c.parte === "fornecedor" && c.tipo !== "aditivo" && info.origem !== "solicitacao" && html`<p class="text-[12.5px] text-muted-foreground">Esta PP não precisa de contrato? <button type="button" class="font-semibold text-california-red hover:underline" onClick=${() => abrirModal({ tipo: "dispensa", id: c.id })}>Dispensar com justificativa</button></p>`}
  </div>`;

  /* ----- Passo 2: lacunas ----- */
  const sugestao = sugestaoDeObjeto(info, ppIds, db);
  const passo2 = modelo && html`<div class="grid min-h-0 flex-1 overflow-y-auto lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] lg:overflow-hidden">
    <div class="space-y-5 border-border px-6 py-6 lg:min-h-0 lg:overflow-y-auto lg:border-r">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0"><p class="text-[11px] font-semibold uppercase tracking-[0.08em] text-muted-foreground">Modelo</p><p class="truncate text-[14px] font-bold">${modelo.nome} <span class="font-medium text-muted-foreground">· v${modelo.versao}</span></p></div>
        <${Botao} v="fantasma" t="xs" icone="rotate" onClick=${() => setPasso(1)}>Trocar</${Botao}>
      </div>

      ${textoEditado && html`<div class="flex items-start gap-2.5 rounded-xl border border-[#fde68a] bg-[#fffbeb] px-3.5 py-3 text-[12.5px] text-[#92400e]">
        <${Icon} n="alert" c="mt-0.5 h-3.5 w-3.5" />
        <p class="min-w-0 flex-1">Você ajustou o texto do contrato na revisão. O que mudar aqui não chega a esse texto.</p>
        <button type="button" class="shrink-0 font-bold hover:underline" onClick=${() => setTextoEditado(null)}>Descartar ajustes</button>
      </div>`}
      <section class="space-y-4">
        <div class="flex items-center justify-between"><h3 class="text-[14px] font-bold">Lacunas a preencher</h3><span class=${cn("rounded-full px-2.5 py-0.5 text-[11.5px] font-bold", faltando.length ? "bg-california-red-soft text-[#b3323c]" : "bg-emerald-50 text-emerald-700")}>${lacunas.length - faltando.length} de ${lacunas.length}</span></div>
        ${lacunas.map((l) => {
          const v = campos[l.chave] || "";
          const set = (val) => setCampos({ ...campos, [l.chave]: val });
          return html`<div key=${l.chave}>
            <${Rotulo} para=${`lac-${l.chave}`} obrigatorio=${l.obrigatoria} extra=${l.chave === "objeto" && c.parte === "fornecedor" && info.origem !== "solicitacao" && html`<button type="button" class="ml-auto inline-flex items-center gap-1 text-[11.5px] font-semibold text-california-red hover:underline" onClick=${() => abrirModal({ tipo: "pedir", id: c.id })}><${Icon} n="message" c="h-3 w-3" />Pedir ao produtor</button>`}>${l.rotulo}</${Rotulo}>
            ${l.tipo === "longo" ? html`<textarea id=${`lac-${l.chave}`} rows="3" value=${v} onInput=${(e) => set(e.target.value)} placeholder=${l.dica} class=${AREA}></textarea>` : html`<input id=${`lac-${l.chave}`} type="text" value=${v} onInput=${(e) => set(e.target.value)} placeholder=${l.dica} class=${CAMPO} />`}
            ${l.chave === "objeto" && !v.trim() && sugestao && html`<div class="mt-2 flex items-start gap-2.5 rounded-xl border border-blue-200 bg-blue-50/70 px-3 py-2.5">
              <${Icon} n="sparkles" c="mt-0.5 h-3.5 w-3.5 text-blue-700" />
              <p class="min-w-0 flex-1 text-[12.5px] leading-snug text-blue-900"><span class="font-semibold">Sugestão ${c.parte === "cliente" ? "a partir do job" : c.tipo === "aditivo" ? "a partir da reemissão" : "a partir da PP"}:</span> ${sugestao}</p>
              <button type="button" class="shrink-0 text-[12px] font-bold text-blue-700 hover:underline" onClick=${() => set(sugestao)}>Usar</button>
            </div>`}
          </div>`;
        })}
      </section>

      ${(modelo.clausulasOpcionais || []).length > 0 && html`<section class="space-y-2.5">
        <h3 class="text-[14px] font-bold">Cláusulas opcionais</h3>
        <p class="text-[12.5px] text-muted-foreground">Entram antes do foro. A numeração se ajusta sozinha.</p>
        ${modelo.clausulasOpcionais.map((k) => {
          const on = clausulas.includes(k);
          return html`<label key=${k} class=${cn("flex cursor-pointer items-start gap-3 rounded-xl border px-3.5 py-2.5", on ? "border-california-red/35 bg-[#fffafa]" : "border-border bg-white")}>
            <input id=${`cl-${k}`} type="checkbox" checked=${on} onChange=${() => setClausulas(on ? clausulas.filter((x) => x !== k) : [...clausulas, k])} class="mt-0.5 h-4 w-4 accent-[#E74B56]" />
            <span class="min-w-0"><span class="block text-[13px] font-semibold">${CLAUSULAS[k].titulo.replace(/^DA |^DO /, "").toLowerCase().replace(/^./, (x) => x.toUpperCase())}</span><span class="block text-[12px] text-muted-foreground">${CLAUSULAS[k].resumo}</span></span>
          </label>`;
        })}
      </section>`}

      <details class="group rounded-xl border border-border bg-white">
        <summary class="flex cursor-pointer list-none items-center gap-2 px-4 py-3 text-[13px] font-semibold"><${Icon} n="lock" c="h-3.5 w-3.5 text-muted-foreground" />Campos do sistema neste modelo<span class="ml-auto text-[12px] font-medium text-muted-foreground">${chavesDeSistema(modelo.corpo).length}</span><${Icon} n="chevronDown" c="h-4 w-4 text-muted-foreground transition-transform group-open:rotate-180" /></summary>
        <dl class="space-y-2 border-t border-border px-4 py-3">
          ${chavesDeSistema(modelo.corpo).map((k) => html`<div key=${k} class="grid grid-cols-[minmax(0,2fr)_minmax(0,3fr)] gap-3 text-[12.5px]"><dt class="text-muted-foreground">${(ROTULO_CAMPO[k] || { rotulo: k }).rotulo}</dt><dd class="font-medium">${ctx[k] ?? "—"}</dd></div>`)}
        </dl>
      </details>
    </div>
    <div class="bg-[#efeeeb] px-4 py-6 sm:px-8 lg:min-h-0 lg:overflow-y-auto">
      <div class="mx-auto mb-3 flex max-w-[720px] flex-wrap items-center justify-between gap-2"><p class="text-[12px] font-semibold uppercase tracking-[0.1em] text-muted-foreground">Prévia do contrato</p><${LegendaPapel} /></div>
      <${Papel} nos=${nos} ctx=${ctx} lacunas=${lacunas} onIrLacuna=${irLacuna} />
    </div>
  </div>`;

  /* ----- Passo 3: revisão ----- */
  const passo3 = modelo && html`<div class="grid min-h-0 flex-1 overflow-y-auto lg:grid-cols-[minmax(0,4fr)_minmax(0,7fr)] lg:overflow-hidden">
    <div class="space-y-5 px-6 py-6 lg:min-h-0 lg:overflow-y-auto lg:border-r lg:border-border">
      <section class="rounded-2xl border border-border bg-white p-5 shadow-soft">
        <h3 class="text-[14px] font-bold">Resumo</h3>
        <dl class="mt-3 space-y-2.5 text-[12.5px]">
          ${[["Modelo", `${modelo.nome} · v${modelo.versao}`], ["Partes", ctx._partes.join(" e ")], ["Valor", ctx["valor.total"]], ["Condição", ctx["pagamento.condicao"]], ["Cláusulas opcionais", clausulas.length ? clausulas.map((k) => CLAUSULAS[k].resumo).join("; ") : "Nenhuma"], ...(ppIds.length > 1 ? [["PPs cobertas", ppIds.map((x) => ppDe(db, x).codigo).join(", ")]] : []), ...(textoEditado ? [["Texto", "Ajustado à mão na revisão"]] : [])].map(([k, v]) => html`<div key=${k} class="grid grid-cols-[110px_minmax(0,1fr)] gap-3"><dt class="text-muted-foreground">${k}</dt><dd class="font-medium">${v}</dd></div>`)}
        </dl>
      </section>
      <section class="rounded-2xl border border-border bg-white p-5 shadow-soft">
        <h3 class="text-[14px] font-bold">Ao gerar o contrato</h3>
        <ul class="mt-3 space-y-2.5 text-[12.5px] leading-snug">
          <li class="flex gap-2.5"><${Icon} n="paperclip" c="mt-0.5 h-3.5 w-3.5 text-muted-foreground" /><span>O PDF é anexado a <b>${destino}</b>.</span></li>
          <li class="flex gap-2.5"><${Icon} n="clock" c="mt-0.5 h-3.5 w-3.5 text-muted-foreground" /><span>O status passa a <b>Aguardando assinatura</b>. Quando o assinado chegar, você o anexa aqui.</span></li>
          ${c.parte === "fornecedor" ? html`<li class="flex gap-2.5"><${Icon} n="lock" c="mt-0.5 h-3.5 w-3.5 text-[#b3323c]" /><span>O pagamento ${ppIds.length > 1 ? "das PPs" : "da PP"} continua travado até o contrato assinado ser anexado.</span></li>`
            : html`<li class="flex gap-2.5"><${Icon} n="unlock" c="mt-0.5 h-3.5 w-3.5 text-emerald-700" /><span>O job segue normalmente: o contrato com o cliente não trava a abertura nem as PPs.</span></li>`}
        </ul>
      </section>
      ${faltando.length > 0 && html`<p class="flex items-start gap-2 rounded-xl border border-california-red/25 bg-california-red-soft px-3.5 py-2.5 text-[12.5px] text-[#9f2a33]"><${Icon} n="alert" c="mt-0.5 h-3.5 w-3.5" />Falta preencher: ${faltando.map((l) => l.rotulo).join(", ")}.</p>`}
    </div>
    <div class="bg-[#efeeeb] px-4 py-6 sm:px-8 lg:min-h-0 lg:overflow-y-auto">
      <div class="mx-auto mb-3 flex max-w-[720px] flex-wrap items-center gap-2">
        <p class="mr-auto text-[12px] font-semibold uppercase tracking-[0.1em] text-muted-foreground">${editando ? "Editando o texto do contrato" : "Como vai sair no PDF"}</p>
        ${!editando && textoEditado && html`<${Etiqueta} cor="ambar" icone="pencil">Texto ajustado à mão</${Etiqueta}><${Botao} v="fantasma" t="xs" icone="rotate" onClick=${() => setTextoEditado(null)}>Desfazer ajustes</${Botao}>`}
        ${editando ? html`<${Botao} t="xs" icone="check" onClick=${() => setEditando(false)}>Concluir edição</${Botao}>`
          : html`<${Botao} v="secundario" t="xs" icone="pencil" disabled=${faltando.length > 0} title=${faltando.length ? "Preencha as lacunas antes de editar o texto" : undefined} onClick=${comecarEdicao}>Editar o texto</${Botao}>`}
      </div>
      ${editando && html`<p class="mx-auto mb-3 max-w-[720px] rounded-lg border border-blue-200 bg-blue-50/70 px-3 py-2 text-[12px] leading-snug text-blue-900">Edite como no Word: clique em qualquer trecho. Os dados em azul vêm do cadastro e da PP e ficam travados; se estiverem errados, a correção é na origem.</p>`}
      ${editando ? html`<${ContratoEditavel} key="editando" htmlInicial=${baseEdicao} editavel onMuda=${setTextoEditado} />`
        : textoEditado ? html`<${ContratoEditavel} key="ajustado" htmlInicial=${textoEditado} />`
        : html`<${Papel} nos=${nos} ctx=${ctx} lacunas=${lacunas} modo="final" onIrLacuna=${(k) => { setPasso(2); setTimeout(() => irLacuna(k), 60); }} />`}
    </div>
  </div>`;

  return html`<div class="flex h-full min-h-0 flex-col">
    <${CabecalhoGaveta} info=${info} onFechar=${onFechar} passos=${["Modelo", "Lacunas", "Revisão"]} passo=${passo} onPasso=${setPasso} />
    <div ref=${corpoRef} class=${cn("flex min-h-0 flex-1 flex-col", passo === 1 && "overflow-y-auto")}>${passo === 1 ? passo1 : passo === 2 ? passo2 : passo3}</div>
    <div class="rodape-gaveta flex flex-wrap items-center gap-2 border-t border-border bg-white px-6 py-3">
      <button type="button" onClick=${() => { onFechar(); irJob(info.planilha.jobId, "planilha", info.planilha.item); }} class="inline-flex items-center gap-1.5 text-[12.5px] font-semibold text-[#047857] hover:underline"><${Icon} n="sheet" c="h-4 w-4" />Ver ${info.planilha.item ? "o item" : ""} na planilha interna</button>
      <div class="ml-auto flex flex-wrap items-center gap-2">
        ${passo > 1 && html`<${Botao} v="fantasma" t="sm" icone="chevronLeft" onClick=${() => setPasso(passo - 1)}>Voltar</${Botao}>`}
        ${passo > 1 && html`<${Botao} v="secundario" t="sm" onClick=${() => { acoes.salvarRascunho(c.id, dadosParaSalvar()); onFechar(); }}>Salvar rascunho</${Botao}>`}
        ${passo === 1 && html`<${Botao} v="primario" t="sm" disabled=${!modelo} onClick=${() => setPasso(2)}>Preencher lacunas<${Icon} n="arrowRight" c="h-3.5 w-3.5" /></${Botao}>`}
        ${passo === 2 && html`<${Botao} v="primario" t="sm" onClick=${() => setPasso(3)}>Revisar<${Icon} n="arrowRight" c="h-3.5 w-3.5" /></${Botao}>`}
        ${passo === 3 && html`<${Botao} v="primario" t="sm" icone="fileCheck" disabled=${faltando.length > 0 || editando} onClick=${() => acoes.gerar(c.id, dadosParaSalvar(), destino, irParaJob)}>Gerar contrato</${Botao}>`}
      </div>
    </div>
  </div>`;
}

/* Contrato já gerado, assinado, dispensado ou coberto por contrato-quadro. */
function VerContrato({ id, onFechar }) {
  const { db, acoes, irJob } = useStore();
  const c = db.contratos.find((x) => x.id === id);
  const info = infoContrato(db, c);
  const [arquivo, setArquivo] = useState("");
  const [data, setData] = useState(HOJE);
  const modelo = c.modeloId ? modeloDe(db, c.modeloId) : null;
  const ctx = contextoDoContrato(db, c);
  const nos = modelo ? montarDocumento(modelo.corpo, ctx, c.campos || {}, c.clausulas || []) : [];
  const nomeAssinado = (c.arquivo || "contrato.pdf").replace(/-v\d+\.pdf$/, "-assinado.pdf");
  const pagamentoTexto = c.parte === "fornecedor" ? `Pagamento de ${info.pps.map((p) => p.codigo).join(" e ") || info.codigo} liberado para o financeiro.` : null;
  const destinoJob = () => { onFechar(); irJob(info.job.id, c.parte === "cliente" || info.origem === "solicitacao" ? "info" : "pps"); };

  return html`<div class="flex h-full min-h-0 flex-col">
    <${CabecalhoGaveta} info=${info} onFechar=${onFechar} />
    <div class="grid min-h-0 flex-1 overflow-y-auto lg:grid-cols-[minmax(0,4fr)_minmax(0,7fr)] lg:overflow-hidden">
      <div class="space-y-4 px-6 py-6 lg:min-h-0 lg:overflow-y-auto lg:border-r lg:border-border">
        ${c.status === "assinatura" && html`<section class="rounded-2xl border border-blue-200 bg-blue-50/50 p-5">
          <h3 class="flex items-center gap-2 text-[14px] font-bold"><${Icon} n="upload" c="h-4 w-4 text-blue-700" />Registrar assinatura</h3>
          <p class="mt-1 text-[12.5px] text-muted-foreground">Anexe o contrato assinado pelas duas partes.${c.parte === "fornecedor" ? " O pagamento da PP é liberado na hora." : ""}</p>
          <div class="mt-4 space-y-3">
            <div>
              <${Rotulo} para="arquivo-assinado" obrigatorio>PDF assinado</${Rotulo}>
              <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-dashed border-[#bcd0ee] bg-white px-3.5 py-3 hover:border-blue-400">
                <${Icon} n="paperclip" c="h-4 w-4 text-muted-foreground" />
                <span class="min-w-0 flex-1 truncate text-[13px] ${arquivo ? "font-semibold" : "text-muted-foreground"}">${arquivo || "Escolher arquivo…"}</span>
                <input id="arquivo-assinado" type="file" accept=".pdf,application/pdf" class="sr-only" onChange=${(e) => setArquivo(e.target.files[0] ? e.target.files[0].name : "")} />
              </label>
              ${!arquivo && html`<button type="button" class="mt-1.5 text-[12px] font-semibold text-blue-700 hover:underline" onClick=${() => setArquivo(nomeAssinado)}>Usar um arquivo de exemplo</button>`}
            </div>
            <div><${Rotulo} para="data-assinatura" obrigatorio>Data da assinatura</${Rotulo}><input id="data-assinatura" type="date" value=${data} max=${HOJE} onInput=${(e) => setData(e.target.value)} class=${CAMPO} /></div>
            <${Botao} v="primario" icone="fileCheck" class="w-full" disabled=${!arquivo || !data} onClick=${() => acoes.assinar(c.id, arquivo, data, pagamentoTexto)}>Anexar contrato assinado</${Botao}>
          </div>
        </section>`}

        ${c.status === "dispensado" && html`<section class="rounded-2xl border border-border bg-white p-5 shadow-soft"><h3 class="flex items-center gap-2 text-[14px] font-bold"><${Icon} n="ban" c="h-4 w-4 text-muted-foreground" />Contrato dispensado</h3><p class="mt-2 text-[13px]">${c.dispensa.motivo}</p>${c.dispensa.justificativa && html`<p class="mt-1 text-[12.5px] text-muted-foreground">${c.dispensa.justificativa}</p>`}</section>`}
        ${c.status === "quadro" && html`<section class="rounded-2xl border border-emerald-200 bg-emerald-50/50 p-5"><h3 class="flex items-center gap-2 text-[14px] font-bold"><${Icon} n="shield" c="h-4 w-4 text-emerald-700" />Coberta pelo ${c.quadro}</h3><p class="mt-2 text-[12.5px] text-muted-foreground">${info.contraparte.quadro.objeto}. Assinado em ${dataBr(info.contraparte.quadro.assinadoEm)}, vigente até ${dataBr(info.contraparte.quadro.vigencia)}.</p></section>`}

        <section class="space-y-2">
          <h3 class="text-[12px] font-bold uppercase tracking-[0.1em] text-muted-foreground">Anexado a ${c.parte === "cliente" ? "Informações do job" : "PP"}</h3>
          ${c.arquivoAssinado && html`<${Arquivo} nome=${c.arquivoAssinado} sub=${`Assinado em ${dataBr(c.assinadoEm)}`} assinado onAbrir=${() => {}} />`}
          ${c.arquivo && html`<${Arquivo} nome=${c.arquivo} sub=${modelo ? `Gerado com ${modelo.nome} · v${c.modeloVersao}` : "Gerado"} onAbrir=${() => {}} />`}
          ${!c.arquivo && !c.arquivoAssinado && html`<p class="text-[12.5px] text-muted-foreground">Nenhum arquivo.</p>`}
          <button type="button" onClick=${destinoJob} class="inline-flex items-center gap-1.5 pt-1 text-[12.5px] font-semibold text-california-red hover:underline"><${Icon} n="external" c="h-3.5 w-3.5" />Ver no job ${info.job.codigo}</button>
        </section>

        ${c.parte === "fornecedor" && info.pps.length > 0 && html`<section class="rounded-2xl border border-border bg-white p-4 shadow-soft">
          <h3 class="mb-2 text-[12px] font-bold uppercase tracking-[0.1em] text-muted-foreground">Pagamento</h3>
          ${info.pps.map((p) => html`<div key=${p.id} class="flex items-center justify-between gap-3 py-1 text-[12.5px]"><span><span class="font-mono font-semibold">${p.codigo}</span> · <${SeloPP} status=${p.status} /></span><${Pagamento} pp=${p} /></div>`)}
        </section>`}

        ${html`<section>
          <h3 class="mb-2 flex items-center gap-2 text-[12px] font-bold uppercase tracking-[0.1em] text-muted-foreground"><${Icon} n="history" c="h-3.5 w-3.5" />Histórico</h3>
          <ol class="relative space-y-3 border-l border-border pl-4">
            ${[...(c.historico || [])].reverse().map((h, i) => html`<li key=${i} class="relative"><span class="absolute -left-[21px] top-1.5 h-2.5 w-2.5 rounded-full border-2 border-white bg-[#bdbdbd]"></span><p class="text-[12.5px] leading-snug">${h.texto}</p><p class="text-[11px] text-muted-foreground">${dataHoraBr(h.em)} · ${h.por}</p></li>`)}
          </ol>
        </section>`}

        ${c.status === "assinatura" && html`<${Botao} v="fantasma" t="sm" icone="pencil" onClick=${() => acoes.reabrir(c.id)}>Corrigir e gerar nova versão</${Botao}>`}
      </div>
      <div class="bg-[#efeeeb] px-4 py-6 sm:px-8 lg:min-h-0 lg:overflow-y-auto">
        ${c.textoEditado ? html`<p class="mx-auto mb-3 max-w-[720px]"><${Etiqueta} cor="ambar" icone="pencil">Texto ajustado à mão antes de gerar</${Etiqueta}></p><${ContratoEditavel} htmlInicial=${c.textoEditado} />`
          : modelo ? html`<${Papel} nos=${nos} ctx=${ctx} lacunas=${lacunasDoModelo(modelo)} modo="final" />` : html`<div class="mx-auto mt-10 max-w-[420px] text-center text-[13px] text-muted-foreground">${c.status === "quadro" ? "Esta PP não tem contrato próprio: ela é coberta pelo contrato-quadro do fornecedor." : "Sem contrato gerado."}</div>`}
      </div>
    </div>
  </div>`;
}

const FAIXA_GRUPO_LISTA = "bg-[#eceae5] border-y border-y-[#dcd9d2]";

${ABERTURA_FORN("CONTRATANTE", "CONTRATADA")}

## DO OBJETO

A CONTRATANTE pagará à CONTRATADA o valor total de {{valor.total}} ({{valor.extenso}}), da seguinte forma: {{pagamento.condicao}}.

function Modelos() {
  const { db, ui, setUi, abrirEditor, acoes } = useStore();
  const f = ui.modelos;
  const setF = (patch) => setUi((u) => ({ ...u, modelos: { ...u.modelos, ...patch } }));
  const [apagando, setApagando] = useState(null);
  const [verArquivados, setVerArquivados] = useState(false);

  const q = f.busca.trim().toLowerCase();
  const todos = db.modelos;
  const filtra = (m) => (f.parte === "todos" || m.parte === f.parte) && (!q || (m.nome + " " + m.descricao).toLowerCase().includes(q));
  const ativos = todos.filter((m) => m.ativo && filtra(m));
  const arquivados = todos.filter((m) => !m.ativo && filtra(m));
  const tipos = ORDEM_TIPOS;
  const cols = [34, 11, 8, 7, 15, 10, 15];
  const TH = "px-4 py-3 font-semibold";

  const linha = (m) => html`<tr key=${m.id} tabIndex="0" onClick=${() => abrirEditor(m.id)} onKeyDown=${(e) => e.key === "Enter" && abrirEditor(m.id)} class=${cn("cursor-pointer border-b border-border transition-colors last:border-0 hover:bg-[#fafaf8]", !m.ativo && "opacity-60")}>
    <td class="px-4 py-3"><p class="flex items-center gap-2 font-semibold">${m.nome}${m.rascunho && html`<${Etiqueta} cor="ambar">Rascunho</${Etiqueta}>`}</p><p class="truncate text-[12px] text-muted-foreground" title=${m.descricao}>${m.descricao}</p></td>
    <td class="px-4 py-3"><span class=${cn(SELO, "whitespace-nowrap", m.parte === "cliente" ? "border-[#cfd8e3] bg-[#f3f6fa] text-[#3b4a5e]" : "border-[#e2dccd] bg-[#f8f5ee] text-[#6b5a35]")}>${m.parte === "cliente" ? "Cliente" : "Fornecedor"}</span></td>
    <td class="px-4 py-3 tabular-nums">${lacunasDoModelo(m).length}</td>
    ${html`<td class="px-4 py-3 font-mono text-[12.5px]">v${m.versao}</td>`}
    <td class="px-4 py-3"><p class="tabular-nums">${dataBr(m.atualizadoEm)}</p><p class="truncate text-[11.5px] text-muted-foreground">${m.atualizadoPor}</p></td>
    <td class="px-4 py-3 tabular-nums">${m.usos} ${m.usos === 1 ? "contrato" : "contratos"}</td>
    <td class="px-3 py-3"><div class="flex items-center justify-center gap-0.5" onClick=${(e) => e.stopPropagation()}>

      <button type="button" title="Duplicar" aria-label=${`Duplicar ${m.nome}`} onClick=${() => acoes.salvarModelo({ ...clone(m), id: `m-${Date.now()}`, nome: `${m.nome} (cópia)`, versao: 1, usos: 0, ativo: true, atualizadoEm: HOJE, atualizadoPor: USUARIO.nome }, true)} class="inline-flex h-8 w-8 items-center justify-center rounded-md text-muted-foreground hover:bg-[#efefef] hover:text-foreground"><${Icon} n="copy" /></button>
      ${!m.ativo ? html`<button type="button" title="Restaurar" aria-label=${`Restaurar ${m.nome}`} onClick=${() => acoes.arquivarModelo(m.id, m.nome, false)} class="inline-flex h-8 w-8 items-center justify-center rounded-md text-muted-foreground hover:bg-[#efefef] hover:text-foreground"><${Icon} n="rotate" /></button>`
        : html`<button type="button" title="Apagar" aria-label=${`Apagar ${m.nome}`} onClick=${() => setApagando(m)} class="inline-flex h-8 w-8 items-center justify-center rounded-md text-muted-foreground hover:bg-red-50 hover:text-[#b42318]"><${Icon} n="trash" /></button>`}
    </div></td>
  </tr>`;

  const colgroup = html`<colgroup>${cols.map((w, i) => html`<col key=${i} style=${`width:${w}%`} />`)}</colgroup>`;
  const thead = html`<thead><tr class="border-b border-border bg-muted/60 text-left text-[11px] font-semibold uppercase tracking-[0.07em] text-muted-foreground"><th class=${TH}>Modelo</th><th class=${TH}>Aplica-se a</th><th class=${TH}>Lacunas</th>${html`<th class=${TH}>Versão</th>`}<th class=${TH}>Atualizado</th><th class=${TH}>Usado em</th><th class=${cn(TH, "text-center")}>Ações</th></tr></thead>`;

  return html`<div class="space-y-5">
    <div class="flex flex-wrap items-center gap-2.5">
      <${Busca} id="busca-modelos" valor=${f.busca} onTroca=${(v) => setF({ busca: v })} placeholder="Buscar modelo" class="w-full sm:w-72" />
      <${Segmentado} rotulo="Aplica-se a" valor=${f.parte} onTroca=${(v) => setF({ parte: v })} opcoes=${[{ k: "todos", rotulo: "Todos" }, { k: "cliente", rotulo: "Cliente" }, { k: "fornecedor", rotulo: "Fornecedor" }]} />
      <div class="ml-auto"><${Botao} icone="plus" onClick=${() => abrirEditor(null)}>Novo modelo</${Botao}></div>
